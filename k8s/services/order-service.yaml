apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: shoplite/order-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ORDER_DB_USER
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: ORDER_DB_USER }
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: ORDER_DB_PASSWORD }
            - name: ORDER_DB_NAME
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: ORDER_DB_NAME }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(ORDER_DB_USER):$(ORDER_DB_PASSWORD)@order-db:5432/$(ORDER_DB_NAME)"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: RABBITMQ_PASSWORD }
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: USER_SERVICE_URL }
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: CATALOG_SERVICE_URL }
            - name: HTTP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: HTTP_TIMEOUT_SECONDS }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: LOG_LEVEL }
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shoplite
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000

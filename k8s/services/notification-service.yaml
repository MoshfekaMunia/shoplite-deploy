apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: shoplite/notification-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: REDIS_PASSWORD }
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@notification-db:6379/0"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: shoplite-secrets, key: RABBITMQ_PASSWORD }
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
            - name: NOTIFICATION_TTL_SECONDS
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: NOTIFICATION_TTL_SECONDS }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: shoplite-config, key: LOG_LEVEL }
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shoplite
spec:
  selector:
    app: notification-service
  ports:
    - port: 8000
      targetPort: 8000
